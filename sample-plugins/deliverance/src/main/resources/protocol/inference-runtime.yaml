openapi: 3.1.0
info:
  title: JavaClaw Inference Service Payload Protocol
  version: 1.2.0
  description: |
    Deliverance Host adapter 与服务插件各自生成 DTO 的唯一业务载荷来源。
    所有载荷均通过 service-plugin.yaml 定义的已鉴权双向 Socket 传输；本协议不定义进程、
    HTTP、stdio、端口或 bearer 生命周期。
paths: {}
x-javaclaw-residency:
  admission: process-memory-budget
  eviction: least-recently-used-idle-model
  activeModelsEvictable: false
  oversizedModelError: resource_exhausted
  cancellableWait: true
  legacyResidentCountFieldsIgnored: true
components:
  schemas:
    StartupConfig:
      type: object
      additionalProperties: false
      required: [runtimeId, modelPath, modelKind, modelName, contextLength,
                 embeddingDimensions, loadParameters, defaultParameters, probeMode]
      properties:
        runtimeId: { type: string, minLength: 1 }
        modelPath: { type: string, minLength: 1 }
        modelKind: { enum: [GENERATION, EMBEDDING] }
        modelName: { type: string, minLength: 1 }
        contextLength: { type: integer, minimum: 0 }
        embeddingDimensions: { type: integer, minimum: 0 }
        loadParameters: { type: object, additionalProperties: true }
        defaultParameters: { type: object, additionalProperties: true }
        probeMode: { type: boolean }
    Message:
      type: object
      additionalProperties: false
      required: [role, content, reasoningContent, toolCallId, toolCalls]
      properties:
        role: { enum: [SYSTEM, USER, ASSISTANT, TOOL] }
        content: { type: string }
        reasoningContent: { type: string }
        toolCallId: { type: string }
        toolCalls: { type: array, items: { $ref: "#/components/schemas/ToolCall" } }
    Tool:
      type: object
      additionalProperties: false
      required: [name, description, inputSchema]
      properties:
        name: { type: string }
        description: { type: string }
        inputSchema: { type: object, additionalProperties: true }
    ToolCall:
      type: object
      additionalProperties: false
      required: [id, name, argumentsJson]
      properties:
        id: { type: string }
        name: { type: string }
        argumentsJson: { type: string }
    ToolChoice:
      type: object
      additionalProperties: false
      required: [mode, toolName]
      properties:
        mode: { enum: [AUTO, NONE, REQUIRED, NAMED] }
        toolName: { type: string }
    ChatRequest:
      type: object
      additionalProperties: false
      required: [requestId, messages, parameters, toolChoice, parallelToolCalls, stream]
      properties:
        requestId: { type: string }
        messages: { type: array, minItems: 1, items: { $ref: "#/components/schemas/Message" } }
        tools: { type: array, items: { $ref: "#/components/schemas/Tool" } }
        parameters: { type: object, additionalProperties: true }
        toolChoice: { $ref: "#/components/schemas/ToolChoice" }
        parallelToolCalls: { type: boolean }
        stream: { type: boolean }
    EmbeddingRequest:
      type: object
      additionalProperties: false
      required: [requestId, input]
      properties:
        requestId: { type: string }
        input: { type: array, minItems: 1, items: { type: string } }
    Usage:
      type: object
      additionalProperties: false
      required: [promptTokens, completionTokens]
      properties:
        promptTokens: { type: integer, minimum: 0 }
        completionTokens: { type: integer, minimum: 0 }
    ChatResponse:
      type: object
      additionalProperties: false
      required: [requestId, model, content, reasoningContent, toolCalls, finishReason,
                 usage, queueTimeMs, inferenceTimeMs]
      properties:
        requestId: { type: string }
        model: { type: string }
        content: { type: string }
        reasoningContent: { type: string }
        toolCalls: { type: array, items: { $ref: "#/components/schemas/ToolCall" } }
        finishReason: { enum: [STOP, LENGTH, TOOL_CALLS, CONTENT_FILTER, CANCELLED, ERROR] }
        usage: { $ref: "#/components/schemas/Usage" }
        queueTimeMs: { type: integer, minimum: 0 }
        inferenceTimeMs: { type: integer, minimum: 0 }
    EmbeddingResponse:
      type: object
      additionalProperties: false
      required: [requestId, model, dimensions, embeddings, usage, inferenceTimeMs]
      properties:
        requestId: { type: string }
        model: { type: string }
        dimensions: { type: integer, minimum: 1 }
        embeddings:
          type: array
          items:
            type: array
            items: { type: number, format: float }
        usage: { $ref: "#/components/schemas/Usage" }
        inferenceTimeMs: { type: integer, minimum: 0 }
    StreamEvent:
      type: object
      additionalProperties: false
      required: [requestId, type, text, toolCalls, timestampEpochMilli]
      properties:
        requestId: { type: string }
        type: { enum: [STARTED, CONTENT_DELTA, REASONING_DELTA, TOOL_CALL_DELTA, USAGE, COMPLETE, ERROR, CANCELLED] }
        text: { type: string }
        toolCalls: { type: array, items: { $ref: "#/components/schemas/ToolCall" } }
        usage: { anyOf: [{ $ref: "#/components/schemas/Usage" }, { type: "null" }] }
        response: { anyOf: [{ $ref: "#/components/schemas/ChatResponse" }, { type: "null" }] }
        errorCode: { type: [string, "null"] }
        errorMessage: { type: [string, "null"] }
        timestampEpochMilli: { type: integer, minimum: 0 }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/ErrorBody" }
    ErrorBody:
      type: object
      additionalProperties: false
      required: [message, type, code]
      properties:
        message: { type: string }
        type: { type: string }
        param: { type: [string, "null"] }
        code: { type: string }
        usage: { anyOf: [{ $ref: "#/components/schemas/Usage" }, { type: "null" }] }
