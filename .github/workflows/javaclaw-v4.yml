name: JavaClaw 4.0 native release gate

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v4.0.0"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: javaclaw-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-verify:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos
            arch: arm64
          - os: macos-15-intel
            platform: macos
            arch: x64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - os: windows-2025
            platform: windows
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      JAVACLAW_APPLE_SIGN_IDENTITY: ${{ secrets.JAVACLAW_APPLE_SIGN_IDENTITY }}
      JAVACLAW_APPLE_NOTARY_PROFILE: ${{ secrets.JAVACLAW_APPLE_NOTARY_PROFILE }}
      JAVACLAW_APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.JAVACLAW_APPLE_CERTIFICATE_P12_BASE64 }}
      JAVACLAW_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.JAVACLAW_APPLE_CERTIFICATE_PASSWORD }}
      JAVACLAW_APPLE_KEYCHAIN_PASSWORD: ${{ secrets.JAVACLAW_APPLE_KEYCHAIN_PASSWORD }}
      JAVACLAW_APPLE_NOTARY_KEY_BASE64: ${{ secrets.JAVACLAW_APPLE_NOTARY_KEY_BASE64 }}
      JAVACLAW_APPLE_NOTARY_KEY_ID: ${{ secrets.JAVACLAW_APPLE_NOTARY_KEY_ID }}
      JAVACLAW_APPLE_NOTARY_ISSUER: ${{ secrets.JAVACLAW_APPLE_NOTARY_ISSUER }}
      JAVACLAW_LINUX_PRIVATE_KEY_BASE64: ${{ secrets.JAVACLAW_LINUX_PRIVATE_KEY_BASE64 }}
      JAVACLAW_LINUX_SIGNING_PASSPHRASE: ${{ secrets.JAVACLAW_LINUX_SIGNING_PASSPHRASE }}
      JAVACLAW_WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.JAVACLAW_WINDOWS_CERTIFICATE_PFX_BASE64 }}
      JAVACLAW_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.JAVACLAW_WINDOWS_CERTIFICATE_PASSWORD }}
      JAVACLAW_WINDOWS_TIMESTAMP_URL: ${{ secrets.JAVACLAW_WINDOWS_TIMESTAMP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # 各平台使用同一父 POM 门禁；CI 只检查，绝不自动重写待审阅代码。
      - name: Verify source format and contracts
        run: >-
          mvn --batch-mode --no-transfer-progress
          spotless:check checkstyle:check

      - name: Freeze the formal Maven version
        if: startsWith(github.ref, 'refs/tags/v4.0.0')
        shell: bash
        run: >-
          mvn --batch-mode --no-transfer-progress
          org.codehaus.mojo:versions-maven-plugin:2.18.0:set
          -DnewVersion=4.0.0 -DgenerateBackupPoms=false

      - name: Install Linux sandbox and packaging prerequisites
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap fakeroot rpm xvfb

      - name: Install Windows packaging prerequisites
        if: matrix.platform == 'windows'
        shell: pwsh
        run: choco install wixtoolset --no-progress --yes

      - name: Provision pinned browser assets and notices
        if: matrix.platform != 'linux'
        run: >-
          mvn --batch-mode --no-transfer-progress -pl javaclaw-browser-service -am
          -DskipTests -Djavaclaw.browser.install verify

      - name: Provision pinned browser assets and native Linux dependencies
        if: matrix.platform == 'linux'
        run: >-
          mvn --batch-mode --no-transfer-progress -pl javaclaw-browser-service -am
          -DskipTests -Djavaclaw.browser.install -Djavaclaw.browser.with-deps verify

      - name: Import Apple signing and notarization credentials
        if: startsWith(github.ref, 'refs/tags/v4.0.0') && matrix.platform == 'macos'
        shell: bash
        run: |
          : "${JAVACLAW_APPLE_CERTIFICATE_P12_BASE64:?missing Apple P12}"
          : "${JAVACLAW_APPLE_CERTIFICATE_PASSWORD:?missing Apple P12 password}"
          : "${JAVACLAW_APPLE_KEYCHAIN_PASSWORD:?missing temporary keychain password}"
          : "${JAVACLAW_APPLE_NOTARY_KEY_BASE64:?missing App Store Connect key}"
          : "${JAVACLAW_APPLE_NOTARY_KEY_ID:?missing App Store Connect key id}"
          : "${JAVACLAW_APPLE_NOTARY_ISSUER:?missing App Store Connect issuer}"
          certificate="$RUNNER_TEMP/javaclaw-release.p12"
          notary_key="$RUNNER_TEMP/AuthKey_${JAVACLAW_APPLE_NOTARY_KEY_ID}.p8"
          keychain="$RUNNER_TEMP/javaclaw-release.keychain-db"
          printf '%s' "$JAVACLAW_APPLE_CERTIFICATE_P12_BASE64" | openssl base64 -d -A >"$certificate"
          printf '%s' "$JAVACLAW_APPLE_NOTARY_KEY_BASE64" | openssl base64 -d -A >"$notary_key"
          security create-keychain -p "$JAVACLAW_APPLE_KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$JAVACLAW_APPLE_KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -P "$JAVACLAW_APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$JAVACLAW_APPLE_KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
          xcrun notarytool store-credentials "$JAVACLAW_APPLE_NOTARY_PROFILE" \
            --key "$notary_key" --key-id "$JAVACLAW_APPLE_NOTARY_KEY_ID" \
            --issuer "$JAVACLAW_APPLE_NOTARY_ISSUER"

      - name: Import Linux package signing key
        if: startsWith(github.ref, 'refs/tags/v4.0.0') && matrix.platform == 'linux'
        shell: bash
        run: |
          : "${JAVACLAW_LINUX_PRIVATE_KEY_BASE64:?missing Linux private key}"
          : "${JAVACLAW_LINUX_SIGNING_PASSPHRASE:?missing Linux signing passphrase}"
          printf '%s' "$JAVACLAW_LINUX_PRIVATE_KEY_BASE64" | base64 --decode | gpg --batch --import
          fingerprint=$(gpg --batch --with-colons --list-secret-keys | \
            awk -F: '$1 == "fpr" { print $10; exit }')
          test -n "$fingerprint"
          echo "JAVACLAW_LINUX_SIGNING_KEY=$fingerprint" >>"$GITHUB_ENV"

      - name: Import Windows Authenticode certificate
        if: startsWith(github.ref, 'refs/tags/v4.0.0') && matrix.platform == 'windows'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:JAVACLAW_WINDOWS_CERTIFICATE_PFX_BASE64)) { throw "missing Windows PFX" }
          if ([string]::IsNullOrWhiteSpace($env:JAVACLAW_WINDOWS_CERTIFICATE_PASSWORD)) { throw "missing Windows PFX password" }
          $pfx = Join-Path $env:RUNNER_TEMP 'javaclaw-release.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:JAVACLAW_WINDOWS_CERTIFICATE_PFX_BASE64))
          $password = ConvertTo-SecureString $env:JAVACLAW_WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if ($null -eq $certificate) { throw "PFX import did not return a certificate" }
          "JAVACLAW_WINDOWS_CERTIFICATE=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify runtime, protocol, architecture and native sandbox
        if: matrix.platform != 'linux'
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Djavaclaw.require.native.sandbox=true
          -Djavaclaw.performance.gate=true verify

      - name: Verify native Linux runtime and desktop under Xvfb
        if: matrix.platform == 'linux'
        run: >-
          xvfb-run --auto-servernum mvn --batch-mode --no-transfer-progress
          -Djavaclaw.require.native.sandbox=true
          -Djavaclaw.performance.gate=true verify

      - name: Build unsigned native distribution
        if: ${{ !startsWith(github.ref, 'refs/tags/v4.0.0') }}
        run: >-
          mvn --batch-mode --no-transfer-progress -DskipTests
          -Djavaclaw.distribution -Djavaclaw.native.package
          -pl javaclaw-packaging -am verify

      - name: Build signed native distribution
        if: startsWith(github.ref, 'refs/tags/v4.0.0')
        run: >-
          mvn --batch-mode --no-transfer-progress -DskipTests
          -Djavaclaw.distribution -Djavaclaw.native.package -Djavaclaw.release
          -pl javaclaw-packaging -am verify

      - name: Start packaged App Server health check
        if: matrix.platform != 'windows'
        run: javaclaw-packaging/target/distribution/bin/javaclaw-health

      - name: Start packaged App Server health check (Windows)
        if: matrix.platform == 'windows'
        shell: cmd
        run: javaclaw-packaging\target\distribution\bin\javaclaw-health.cmd

      # 再用发行物自己的 jlink/JAR 启动真实窗口，不能只证明开发机完整 JDK 的 classpath 可用。
      - name: Verify packaged macOS desktop and SDK transcript
        if: matrix.platform == 'macos'
        run: >-
          mvn --batch-mode --no-transfer-progress -pl javaclaw-packaging -am
          -Dtest=DesktopLaunchSmokeTest -Dsurefire.failIfNoSpecifiedTests=false
          -Djavaclaw.desktop.smoke=true
          -Djavaclaw.visual.gate=true
          "-Djavaclaw.smoke.screenshot=${GITHUB_WORKSPACE}/javaclaw-packaging/target/visual/current/ui.png"
          "-Djavaclaw.smoke.java=${GITHUB_WORKSPACE}/javaclaw-packaging/target/distribution/runtime/bin/java"
          "-Djavaclaw.smoke.classpath=${GITHUB_WORKSPACE}/javaclaw-packaging/target/distribution/lib/*" test

      - name: Verify packaged Linux desktop under Xvfb
        if: matrix.platform == 'linux'
        run: >-
          xvfb-run --auto-servernum mvn --batch-mode --no-transfer-progress -pl javaclaw-packaging -am
          -Dtest=DesktopLaunchSmokeTest -Dsurefire.failIfNoSpecifiedTests=false
          -Djavaclaw.desktop.smoke=true
          "-Djavaclaw.smoke.screenshot=${GITHUB_WORKSPACE}/javaclaw-packaging/target/visual/current/ui.png"
          "-Djavaclaw.smoke.java=${GITHUB_WORKSPACE}/javaclaw-packaging/target/distribution/runtime/bin/java"
          "-Djavaclaw.smoke.classpath=${GITHUB_WORKSPACE}/javaclaw-packaging/target/distribution/lib/*" test

      - name: Verify packaged Windows desktop and SDK transcript
        if: matrix.platform == 'windows'
        shell: pwsh
        run: >-
          mvn --batch-mode --no-transfer-progress -pl javaclaw-packaging -am
          -Dtest=DesktopLaunchSmokeTest -Dsurefire.failIfNoSpecifiedTests=false
          -Djavaclaw.desktop.smoke=true
          "-Djavaclaw.smoke.screenshot=$env:GITHUB_WORKSPACE/javaclaw-packaging/target/visual/current/ui.png"
          "-Djavaclaw.smoke.java=$env:GITHUB_WORKSPACE/javaclaw-packaging/target/distribution/runtime/bin/java.exe"
          "-Djavaclaw.smoke.classpath=$env:GITHUB_WORKSPACE/javaclaw-packaging/target/distribution/lib/*" test

      - name: Upload desktop visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javaclaw-ui-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: warn
          path: javaclaw-packaging/target/visual/current/*.png

      - name: Validate macOS installers
        if: matrix.platform == 'macos'
        run: |
          test -s javaclaw-packaging/target/native/JavaClaw-4.0.0.dmg
          test -s javaclaw-packaging/target/native/JavaClaw-4.0.0.pkg
          pkgutil --payload-files javaclaw-packaging/target/native/JavaClaw-4.0.0.pkg >/dev/null
          mount_point="$RUNNER_TEMP/javaclaw-dmg"
          mkdir -p "$mount_point"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_point" \
            javaclaw-packaging/target/native/JavaClaw-4.0.0.dmg
          test -x "$mount_point/JavaClaw.app/Contents/MacOS/JavaClaw"
          hdiutil detach "$mount_point"

      - name: Install and uninstall the macOS PKG
        if: matrix.platform == 'macos'
        run: |
          sudo installer -pkg javaclaw-packaging/target/native/JavaClaw-4.0.0.pkg -target /
          test -x /Applications/JavaClaw.app/Contents/MacOS/JavaClaw
          sudo rm -rf /Applications/JavaClaw.app

      - name: Validate Linux installers
        if: matrix.platform == 'linux'
        run: |
          test -s javaclaw-packaging/target/native/javaclaw_4.0.0-1_${{ matrix.arch == 'x64' && 'amd64' || 'arm64' }}.deb
          dpkg-deb --info javaclaw-packaging/target/native/*.deb >/dev/null
          rpm --query --package --info javaclaw-packaging/target/native/*.rpm >/dev/null

      - name: Install and uninstall the Linux DEB
        if: matrix.platform == 'linux'
        run: |
          sudo dpkg --install javaclaw-packaging/target/native/*.deb
          test -x /opt/javaclaw/bin/javaclaw
          sudo dpkg --remove javaclaw

      - name: Validate Windows installers
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $msi = Get-ChildItem javaclaw-packaging/target/native/*.msi
          $exe = Get-ChildItem javaclaw-packaging/target/native/*.exe
          if ($msi.Length -ne 1 -or $exe.Length -ne 1) { throw "missing MSI or EXE" }
          if ($msi[0].Length -le 0 -or $exe[0].Length -le 0) { throw "empty installer" }

      - name: Install and uninstall the Windows MSI
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $msi = (Get-ChildItem javaclaw-packaging/target/native/*.msi).FullName
          $install = Start-Process msiexec.exe -ArgumentList @('/i', $msi, '/qn', '/norestart') -Wait -PassThru
          if ($install.ExitCode -notin 0, 3010) { throw "MSI install failed: $($install.ExitCode)" }
          $launcher = Join-Path $env:ProgramFiles 'JavaClaw/JavaClaw.exe'
          if (-not (Test-Path -LiteralPath $launcher -PathType Leaf)) { throw "installed launcher is missing" }
          $remove = Start-Process msiexec.exe -ArgumentList @('/x', $msi, '/qn', '/norestart') -Wait -PassThru
          if ($remove.ExitCode -notin 0, 3010) { throw "MSI uninstall failed: $($remove.ExitCode)" }

      - name: Verify formal platform signatures
        if: startsWith(github.ref, 'refs/tags/v4.0.0')
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            macos)
              pkgutil --check-signature javaclaw-packaging/target/native/*.pkg
              spctl --assess --type install javaclaw-packaging/target/native/*.pkg
              ;;
            linux)
              for signature in javaclaw-packaging/target/native/*.asc; do
                gpg --batch --verify "$signature" "${signature%.asc}"
              done
              ;;
            windows)
              powershell.exe -NoProfile -NonInteractive -Command \
                '$files = Get-ChildItem javaclaw-packaging/target/native -File | Where-Object { $_.Extension -in ".msi", ".exe" }; foreach ($file in $files) { if ((Get-AuthenticodeSignature -LiteralPath $file.FullName).Status -ne "Valid") { throw "invalid signature: $($file.Name)" } }; $launcher = "javaclaw-packaging/target/windows-app-image/JavaClaw/JavaClaw.exe"; if ((Get-AuthenticodeSignature -LiteralPath $launcher).Status -ne "Valid") { throw "invalid packaged launcher signature" }'
              ;;
          esac

      - name: Give native installers collision-safe names
        shell: bash
        run: |
          native=javaclaw-packaging/target/native
          case "${{ matrix.platform }}" in
            macos)
              for extension in dmg pkg; do
                source="$native/JavaClaw-4.0.0.$extension"
                target="$native/JavaClaw-4.0.0-macos-${{ matrix.arch }}.$extension"
                mv "$source" "$target"
                rm -f "$source.sha256"
              done
              ;;
            windows)
              for extension in msi exe; do
                source=$(find "$native" -maxdepth 1 -type f -name "*.$extension" -print -quit)
                target="$native/JavaClaw-4.0.0-windows-${{ matrix.arch }}.$extension"
                test -n "$source"
                mv "$source" "$target"
                rm -f "$source.sha256"
              done
              ;;
          esac

      - name: Give platform metadata collision-safe names
        shell: bash
        run: |
          metadata=javaclaw-packaging/target/release-metadata
          mkdir -p "$metadata"
          cp javaclaw-packaging/target/distribution/sbom.json \
            "$metadata/sbom-${{ matrix.platform }}-${{ matrix.arch }}.json"
          cp javaclaw-packaging/target/distribution/THIRD-PARTY.txt \
            "$metadata/THIRD-PARTY-${{ matrix.platform }}-${{ matrix.arch }}.txt"
          cp javaclaw-client/target/performance-gate.json \
            "$metadata/performance-gate-${{ matrix.platform }}-${{ matrix.arch }}.json"

      - name: Regenerate checksums after canonical renaming
        shell: bash
        run: |
          checksum() {
            directory=$(dirname "$1")
            filename=$(basename "$1")
            if command -v sha256sum >/dev/null 2>&1; then
              (cd "$directory" && sha256sum "$filename" >"$filename.sha256")
            else
              (cd "$directory" && shasum -a 256 "$filename" >"$filename.sha256")
            fi
          }
          while IFS= read -r -d '' artifact; do checksum "$artifact"; done < <(
            find javaclaw-packaging/target/native \
                 javaclaw-packaging/target/release-metadata \
                 -type f ! -name '*.sha256' -print0
          )

      - name: Verify every published checksum
        shell: bash
        run: |
          verify_checksum() {
            directory=$(dirname "$1")
            filename=$(basename "$1")
            if command -v sha256sum >/dev/null 2>&1; then
              (cd "$directory" && sha256sum --check "$filename")
            else
              (cd "$directory" && shasum -a 256 --check "$filename")
            fi
          }
          while IFS= read -r -d '' checksum; do verify_checksum "$checksum"; done < <(
            find javaclaw-packaging/target -type f -name '*.sha256' -print0
          )

      - name: Stage a flat collision-safe release directory
        shell: bash
        run: |
          publish=javaclaw-packaging/target/publish
          rm -rf "$publish"
          mkdir -p "$publish"
          copy_unique() {
            source=$1
            target="$publish/$(basename "$source")"
            test ! -e "$target"
            cp "$source" "$target"
          }
          while IFS= read -r -d '' artifact; do copy_unique "$artifact"; done < <(
            find javaclaw-packaging/target/native \
                 javaclaw-packaging/target/release-metadata \
                 -maxdepth 1 -type f -print0
          )
          while IFS= read -r -d '' artifact; do copy_unique "$artifact"; done < <(
            find javaclaw-packaging/target -maxdepth 1 -type f \
                 \( -name 'javaclaw-*.zip' -o -name 'javaclaw-*.zip.sha256' \) -print0
          )
          test -n "$(find "$publish" -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$(find "$publish" -maxdepth 1 -type f -name '*.sha256' -print -quit)"

      - name: Upload same-version platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: javaclaw-4.0.0-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: javaclaw-packaging/target/publish/*

      - name: Remove temporary Apple credentials
        if: always() && startsWith(github.ref, 'refs/tags/v4.0.0') && matrix.platform == 'macos'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/javaclaw-release.keychain-db" || true
          rm -f "$RUNNER_TEMP/javaclaw-release.p12" "$RUNNER_TEMP"/AuthKey_*.p8

      - name: Remove temporary Linux credentials
        if: always() && startsWith(github.ref, 'refs/tags/v4.0.0') && matrix.platform == 'linux'
        shell: bash
        run: |
          if [ -n "${JAVACLAW_LINUX_SIGNING_KEY:-}" ]; then
            gpg --batch --yes --delete-secret-and-public-key "$JAVACLAW_LINUX_SIGNING_KEY" || true
          fi

      - name: Remove temporary Windows credentials
        if: always() && startsWith(github.ref, 'refs/tags/v4.0.0') && matrix.platform == 'windows'
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:JAVACLAW_WINDOWS_CERTIFICATE)) {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:JAVACLAW_WINDOWS_CERTIFICATE" -Force -ErrorAction SilentlyContinue
          }
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'javaclaw-release.pfx') -Force -ErrorAction SilentlyContinue

  release:
    if: startsWith(github.ref, 'refs/tags/v4.0.0')
    needs: native-verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: javaclaw-4.0.0-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            release/*.zip
            release/*.sha256
            release/*.dmg
            release/*.pkg
            release/*.deb
            release/*.rpm
            release/*.msi
            release/*.exe
            release/*.asc
            release/*.json
            release/*.txt
