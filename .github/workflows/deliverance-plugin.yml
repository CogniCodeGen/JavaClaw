name: Deliverance service plugin

on:
  push:
    paths:
      - ".github/workflows/deliverance-plugin.yml"
      - "pom.xml"
      - "src/main/java/com/javaclaw/service/**"
      - "src/main/java/com/javaclaw/plugin/**"
      - "src/main/java/com/javaclaw/infrastructure/serviceplugin/**"
      - "src/main/java/com/javaclaw/infrastructure/inference/**"
      - "src/main/resources/protocol/**"
      - "sample-plugins/deliverance/**"
  pull_request:
    paths:
      - ".github/workflows/deliverance-plugin.yml"
      - "pom.xml"
      - "src/main/java/com/javaclaw/service/**"
      - "src/main/java/com/javaclaw/plugin/**"
      - "src/main/java/com/javaclaw/infrastructure/serviceplugin/**"
      - "src/main/java/com/javaclaw/infrastructure/inference/**"
      - "src/main/resources/protocol/**"
      - "sample-plugins/deliverance/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos
            arch: arm64
          - runner: macos-15-intel
            platform: macos
            arch: x64
          - runner: windows-2025
            platform: windows
            arch: x64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: |
            pom.xml
            sample-plugins/deliverance/pom.xml
      - name: Build Host API and built-in isolated runtime
        shell: bash
        run: mvn --batch-mode --no-transfer-progress -DskipTests install
      - name: Build and test Deliverance sample plugin
        shell: bash
        run: >-
          mvn --batch-mode --no-transfer-progress
          -f sample-plugins/deliverance/pom.xml clean verify
      - name: Verify one-JAR plugin boundary
        shell: bash
        run: |
          test ! -e runtime
          test ! -e service-plugins
          jar tf sample-plugins/deliverance/target/deliverance.jar > "$RUNNER_TEMP/plugin-entries.txt"
          test "$(grep -c '^plugin.json$' "$RUNNER_TEMP/plugin-entries.txt")" = 1
          grep -q '^com/javaclaw/plugins/deliverance/DeliveranceServicePlugin.class$' "$RUNNER_TEMP/plugin-entries.txt"
          if grep -Eq '(^|/).+\.(fxml|css)$|^META-INF/jpms\.args$|^(com/javaclaw/service/(api|runner)/|com/javaclaw/(app|ui|platform)/|org/springframework/|javafx/|org/h2/)' "$RUNNER_TEMP/plugin-entries.txt"; then
            echo "Deliverance JAR contains forbidden custom UI or Host/Runner classes" >&2
            exit 1
          fi
      - name: Upload unsigned staging plugin
        uses: actions/upload-artifact@v7
        with:
          name: deliverance-plugin-${{ matrix.platform }}-${{ matrix.arch }}
          path: sample-plugins/deliverance/target/deliverance.jar
          if-no-files-found: error

  host-isolation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify Host architecture and static plugin discovery
        run: >-
          mvn --batch-mode --no-transfer-progress
          "-Dtest=ArchitectureRulesTest,PluginDescriptorLoaderTest,ServicePluginRegistrarTest,DeliveranceRuntimeManagerTest,ServicePluginProtocolSourceTest"
          test
      - name: Verify API artifact and built-in Runner entry
        run: |
          mvn --batch-mode --no-transfer-progress -DskipTests package
          test -f target/javaclaw-3.0.0-SNAPSHOT-service-plugin-api.jar
          test ! -e target/javaclaw-3.0.0-SNAPSHOT-service-plugin-runner.jar
          jar tf target/javaclaw-3.0.0-SNAPSHOT.jar > "$RUNNER_TEMP/host-entries.txt"
          grep -qx 'com/javaclaw/service/runner/ServicePluginProcessMain.class' "$RUNNER_TEMP/host-entries.txt"
          grep -qx 'com/javaclaw/service/api/ServicePlugin.class' "$RUNNER_TEMP/host-entries.txt"
          ! grep -q 'service-plugin/javaclaw-service-plugin-runner.jar' "$RUNNER_TEMP/host-entries.txt"
