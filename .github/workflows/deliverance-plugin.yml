name: Plugin v2 isolation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolation:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build independent protocol, SDK and Runner
        shell: bash
        run: mvn --batch-mode --no-transfer-progress -pl plugin-runner-java -am clean install
      - name: Verify host and real subprocess lifecycle
        shell: bash
        run: >-
          mvn --batch-mode --no-transfer-progress -pl javaclaw-desktop -am
          -Dtest=ArchitectureRulesTest#externalPluginModulesOnlyDependOnVersionedProtocol,ApplicationHomeTest,RootApplicationContextTest#rootContextProvidesDataExecutionFxAndFxmlInfrastructure+rootContextsOwnIndependentPluginHosts,PluginManifestTest,PluginPackageVerifierTest,PluginStateStoreTest,DefaultPluginManagementServiceTest,RemotePluginHostAdaptersTest,PluginHostServicesTest,ExternalModelConfigurationSnapshotTest,RemoteInferenceGatewayTest,RemoteInferenceEndpointTest,RemoteInferenceRuntimeCatalogTest,RunModelSnapshotBindingTest,PluginScopedInferenceManagementTest,AgentEnginePlanCleanupTest,RunRecoveryCoordinatorPluginFailureTest
          test
      - name: Build standalone sample plugins
        shell: bash
        run: |
          for plugin in hello feishu deliverance echo-model; do
            mvn --batch-mode --no-transfer-progress -f "sample-plugins/$plugin/pom.xml" clean verify
          done
      - name: Assemble isolated distribution
        shell: bash
        run: mvn --batch-mode --no-transfer-progress -DskipTests package
      - name: Verify assembled classpaths and sample ZIP isolation
        shell: bash
        run: |
          for plugin in hello feishu deliverance echo-model; do
            manifest="sample-plugins/$plugin/plugin.json"
            if [[ ! -f "$manifest" ]]; then manifest="sample-plugins/$plugin/src/main/resources/plugin.json"; fi
            java -cp plugin-runner-java/target/plugin-runner-java-4.0.0-SNAPSHOT-all.jar \
              com.javaclaw.plugin.sdk.packaging.PluginPackageMain \
              --manifest "$manifest" --artifact "sample-plugins/$plugin/target/plugin.jar" \
              --output "sample-plugins/$plugin/target/isolation-check.zip"
          done
          python -I scripts/stage-plugin-packages.py \
            sample-plugins/hello/target/isolation-check.zip \
            sample-plugins/feishu/target/isolation-check.zip \
            sample-plugins/deliverance/target/isolation-check.zip \
            sample-plugins/echo-model/target/isolation-check.zip
          mvn --batch-mode --no-transfer-progress -pl distribution -am -DskipTests package
          python -I scripts/verify-plugin-isolation.py \
            sample-plugins/hello/target/isolation-check.zip \
            sample-plugins/feishu/target/isolation-check.zip \
            sample-plugins/deliverance/target/isolation-check.zip \
            sample-plugins/echo-model/target/isolation-check.zip
      - name: Verify bundled Java with a real model plugin
        if: runner.os != 'Windows'
        shell: bash
        run: |
          portable_home="$PWD/target/portable/isolation-home"
          if [[ "$RUNNER_OS" == macOS ]]; then
            bash scripts/assemble-portable-macos.sh --development-unsigned --offline --output "$portable_home"
            bundled_java="$portable_home/runtime/JavaClaw.app/Contents/runtime/Contents/Home/bin/java"
          else
            bash scripts/assemble-portable-linux.sh --offline --output "$portable_home"
            bundled_java="$portable_home/runtime/JavaClaw/lib/runtime/bin/java"
          fi
          mvn --batch-mode --no-transfer-progress -f sample-plugins/echo-model/pom.xml \
            "-Djvm=$bundled_java" "-Dplugin.runner.jar=$portable_home/runtime/plugin-runner.jar" \
            failsafe:integration-test failsafe:verify
          tar -czf "target/portable/javaclaw-$RUNNER_OS-native.tar.gz" -C target/portable isolation-home
      - name: Verify Windows bundled Java with a real model plugin
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $portableHome = Join-Path $PWD 'target/portable/isolation-home'
          & ./scripts/assemble-portable-windows.ps1 -DevelopmentUnsigned -Offline -OutputDirectory $portableHome
          $bundledJava = Join-Path $portableHome 'runtime/JavaClaw/runtime/bin/java.exe'
          $runner = Join-Path $portableHome 'runtime/plugin-runner.jar'
          & mvn --batch-mode --no-transfer-progress -f sample-plugins/echo-model/pom.xml "-Djvm=$bundledJava" "-Dplugin.runner.jar=$runner" failsafe:integration-test failsafe:verify
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Java model integration failed' }
          Compress-Archive -LiteralPath $portableHome -DestinationPath 'target/portable/javaclaw-Windows-native.zip'
      - uses: actions/upload-artifact@v7
        with:
          name: javaclaw-development-${{ matrix.os }}
          path: |
            distribution/target/*-portable.zip
            target/portable/*-native.*
          if-no-files-found: error
