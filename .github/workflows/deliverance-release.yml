name: Signed plugin v2 release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  plugin:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build SDK and standalone plugin
        run: |
          mvn --batch-mode --no-transfer-progress -pl plugin-runner-java -am clean install
          mvn --batch-mode --no-transfer-progress -f sample-plugins/deliverance/pom.xml clean verify
      - name: Create signed immutable ZIP package
        env:
          PRIVATE_KEY: ${{ secrets.PLUGIN_ED25519_PRIVATE_KEY_BASE64 }}
          PUBLIC_KEY: ${{ secrets.PLUGIN_ED25519_PUBLIC_KEY_BASE64 }}
        run: |
          test -n "$PRIVATE_KEY"
          test -n "$PUBLIC_KEY"
          printf '%s' "$PRIVATE_KEY" | base64 --decode > "$RUNNER_TEMP/plugin-private.der"
          printf '%s' "$PUBLIC_KEY" | base64 --decode > "$RUNNER_TEMP/plugin-public.der"
          java -cp plugin-runner-java/target/plugin-runner-java-4.0.0-SNAPSHOT-all.jar \
            com.javaclaw.plugin.sdk.packaging.PluginPackageMain \
            --manifest sample-plugins/deliverance/src/main/resources/plugin.json \
            --artifact sample-plugins/deliverance/target/plugin.jar \
            --output sample-plugins/deliverance/target/deliverance-plugin-v2.zip \
            --private-key "$RUNNER_TEMP/plugin-private.der" --public-key "$RUNNER_TEMP/plugin-public.der"
          rm "$RUNNER_TEMP/plugin-private.der" "$RUNNER_TEMP/plugin-public.der"
      - uses: actions/upload-artifact@v7
        with:
          name: deliverance-plugin-v2
          path: sample-plugins/deliverance/target/deliverance-plugin-v2.zip
          if-no-files-found: error
